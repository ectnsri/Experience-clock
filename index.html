<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body{
    margin:0;
    padding:0;
    background:transparent;
    overflow:hidden;
}

body{
    color:white;
    font-family:
        "Avenir Next",
        "Avenir",
        "Segoe UI",
        Arial,
        sans-serif;
}

.container{
    width:250px;
    height:50px;

    display:flex;
    align-items:center;

    box-sizing:border-box;
}

/* COLONNA 1 */

.source{
    width:55px;

    font-size:9px;
    color:rgba(255,255,255,.75);

    line-height:1.1;
}

/* COLONNA 2 */

.middle{
    width:95px;

    display:flex;
    flex-direction:column;
    justify-content:center;

    font-size:11px;
}

.weather{
    white-space:nowrap;
}

.air{
    white-space:nowrap;
}

/* COLONNA 3 */

.right{
    width:100px;

    display:flex;
    flex-direction:column;
    align-items:flex-end;
    justify-content:center;
}

.date{
    font-size:11px;
    line-height:1.1;
}

.time{
    font-size:16px;
    font-weight:600;
    line-height:1;
}
</style>

</head>
<body>

<div class="container">

    <div class="source">
        Open-<br>Meteo
    </div>

    <div class="middle">
        <div id="weather" class="weather">
            🌤️ Milano
        </div>

        <div id="air" class="air">
            🟢 Qualità aria
        </div>
    </div>

    <div class="right">
        <div id="date" class="date">
            16/10/2026
        </div>

        <div id="time" class="time">
            14:15
        </div>
    </div>

</div>

<script>

function weatherIcon(code){

    if(code === 0) return "☀️";
    if(code <= 3) return "🌤️";
    if(code <= 48) return "☁️";
    if(code <= 67) return "🌦️";
    if(code <= 77) return "❄️";
    if(code <= 82) return "🌧️";

    return "⛈️";
}

function aqiDot(aqi){

    if(aqi <= 40) return "🟢";
    if(aqi <= 60) return "🟡";

    return "🔴";
}

let weather = "🌤️";
let airIcon = "🟢";

async function loadData(){

    try{

        const weatherResponse = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=45.4642&longitude=9.1900&current=weather_code"
        );

        const weatherData = await weatherResponse.json();

        weather = weatherIcon(
            weatherData.current.weather_code
        );

    }catch(e){
        weather = "🌤️";
    }

    try{

        const airResponse = await fetch(
            "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=45.4642&longitude=9.1900&current=european_aqi"
        );

        const airData = await airResponse.json();

        airIcon = aqiDot(
            airData.current.european_aqi
        );

    }catch(e){
        airIcon = "🟢";
    }
}

function updateDisplay(){

    const now = new Date();

    document.getElementById("weather").textContent =
        weather + " Milano";

    document.getElementById("air").textContent =
        airIcon + " Qualità aria";

    document.getElementById("date").textContent =
        now.toLocaleDateString("it-IT");

    document.getElementById("time").textContent =
        now.toLocaleTimeString("it-IT",{
            hour:"2-digit",
            minute:"2-digit"
        });
}

async function initialize(){

    await loadData();

    updateDisplay();

    setInterval(updateDisplay,1000);

    setInterval(loadData,1800000);
}

initialize();

</script>

</body>
</html>
