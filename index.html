<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
}

body {
    font-family:
        "Avenir Next",
        "Avenir",
        "Segoe UI",
        Arial,
        sans-serif;
    color: white;
}

.container {
    width: 520px;
    height: 45px;

    display: flex;
    align-items: right;
    gap: 18px;

    white-space: nowrap;
    overflow: hidden;
}

.source {
    font-size: 10px;
    color: rgba(255,255,255,0.75);
}

.item {
    font-size: 14px;
}

.time,
.temp {
    font-size: 16px;
    font-weight: 600;
}

.air {
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <span class="source">Open-Meteo</span>

    <span id="city" class="item">🌤️ Milano</span>

    <span id="date" class="item">--/--/----</span>

    <span id="time" class="time">--:--</span>

    <span id="temp" class="temp">--°C</span>

    <span id="wind" class="item">-- km/h --</span>

    <span id="air" class="air">⚪ Qualità aria</span>

</div>

<script>

function weatherIcon(code) {

    if (code === 0) return "☀️";
    if (code <= 3) return "🌤️";
    if (code <= 48) return "☁️";
    if (code <= 67) return "🌦️";
    if (code <= 77) return "❄️";
    if (code <= 82) return "🌧️";

    return "⛈️";
}

function windDirection(deg) {

    const dirs = [
        "N", "NE", "E", "SE",
        "S", "SO", "O", "NO"
    ];

    return dirs[Math.round(deg / 45) % 8];
}

function airQualityDisplay(aqi) {

    if (aqi <= 40) {
        return "🟢 Qualità aria";
    }

    if (aqi <= 60) {
        return "🟡 Qualità aria";
    }

    return "🔴 Qualità aria";
}

async function loadData() {

    try {

        const weatherResponse = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=45.4642&longitude=9.1900&current=weather_code,temperature_2m,wind_speed_10m,wind_direction_10m"
        );

        const weatherData = await weatherResponse.json();

        document.getElementById("city").textContent =
            weatherIcon(weatherData.current.weather_code) +
            " Milano";

        document.getElementById("temp").textContent =
            Math.round(weatherData.current.temperature_2m) + "°C";

        document.getElementById("wind").textContent =
            Math.round(weatherData.current.wind_speed_10m) +
            " km/h " +
            windDirection(weatherData.current.wind_direction_10m);

    } catch (error) {

        console.error(error);
    }

    try {

        const airResponse = await fetch(
            "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=45.4642&longitude=9.1900&current=european_aqi"
        );

        const airData = await airResponse.json();

        document.getElementById("air").textContent =
            airQualityDisplay(
                airData.current.european_aqi
            );

    } catch (error) {

        console.error(error);
    }
}

function updateClock() {

    const now = new Date();

    document.getElementById("date").textContent =
        now.toLocaleDateString("it-IT");

    document.getElementById("time").textContent =
        now.toLocaleTimeString("it-IT", {
            hour: "2-digit",
            minute: "2-digit"
        });
}

async function initialize() {

    await loadData();

    updateClock();

    setInterval(updateClock, 1000);

    setInterval(loadData, 1800000);
}

initialize();

</script>

</body>
</html>
