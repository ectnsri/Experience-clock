<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
}

body {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding-right: 10px;

    color: white;

    font-family:
        "Avenir Next",
        "Avenir",
        "Segoe UI",
        Arial,
        sans-serif;
}

.info {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    text-align: right;
}
</style>
</head>

<body>

<div id="info" class="info">
    Loading...
</div>

<script>

function weatherIcon(code) {
    if (code === 0) return "☀️";
    if (code <= 3) return "⛅";
    if (code < 70) return "🌧️";
    if (code < 90) return "❄️";
    return "⛈️";
}

function updateInfo(city, weather) {

    const now = new Date();

    const date =
        now.toLocaleDateString("it-IT");

    const time =
        now.toLocaleTimeString("it-IT", {
            hour: "2-digit",
            minute: "2-digit"
        });

    document.getElementById("info").innerHTML =
        `${city} | ${date} | ${time} | ${weather}`;
}

let city =
    Intl.DateTimeFormat()
        .resolvedOptions()
        .timeZone
        .split("/")
        .pop()
        .replace(/_/g, " ");

let weather = "";

if (navigator.geolocation) {

    navigator.geolocation.getCurrentPosition(function(pos) {

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=weather_code`
        )
        .then(r => r.json())
        .then(data => {

            weather =
                weatherIcon(data.current.weather_code);

            updateInfo(city, weather);

            setInterval(() => {
                updateInfo(city, weather);
            }, 1000);
        });

    });

} else {

    updateInfo(city, "");
    setInterval(() => {
        updateInfo(city, "");
    }, 1000);
}

</script>

</body>
</html>
