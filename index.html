<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
}

body {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding-right: 10px;

    color: white;

    font-family:
        "Avenir Next",
        "Avenir",
        "Segoe UI",
        Arial,
        sans-serif;
}

.container {
    text-align: right;
}

.date {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.2;
}

.time {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.1;
}

</style>
</head>

<body>

<div class="container">
    <div id="date" class="date"></div>
    <div id="time" class="time"></div>
</div>

<script>

function updateClock() {

    const now = new Date();

    document.getElementById("date").innerHTML =
        "Milano, " + now.toLocaleDateString("it-IT");

    document.getElementById("time").innerHTML =
        now.toLocaleTimeString("it-IT", {
            hour: "2-digit",
            minute: "2-digit"
        });
}

updateClock();
setInterval(updateClock, 1000);

</script>

</body>
</html>
