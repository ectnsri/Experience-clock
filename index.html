<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
}

body {
    font-family:
        "Avenir Next",
        "Avenir",
        "Segoe UI",
        Arial,
        sans-serif;
    color: white;
}

.container {
    width: 500px;
    height: 24px;

    display: flex;
    align-items: center;

    gap: 16px;

    white-space: nowrap;
    overflow: hidden;

    box-sizing: border-box;
}

.source {
    font-size: 9px;
    color: rgba(255,255,255,0.75);
}

.item {
    font-size: 11px;
}

.time {
    font-size: 11px;
    font-weight: 600;
}

.air {
    font-size: 11px;
}
</style>
</head>

<body>

<div class="container">

    <span class="source">Open-Meteo</span>

    <span class="item">Milano</span>

    <span id="date" class="item">
        16/10/2026
    </span>

    <span id="time" class="time">
        14:15
    </span>

    <span id="temp" class="item">
        --°C
    </span>

    <span id="wind" class="item">
        -- km/h
    </span>

    <span id="air" class="air">
        🟢 Qualità aria
    </span>

</div>

<script>

function windDirection(degrees) {

    const directions = [
        "N", "NE", "E", "SE",
        "S", "SO", "O", "NO"
    ];

    return directions[
        Math.round(degrees / 45) % 8
    ];
}

function airQualityDisplay(aqi) {

    if (aqi <= 40) {
        return "🟢 Qualità aria";
    }

    if (aqi <= 60) {
        return "🟡 Qualità aria";
    }

    return "🔴 Qualità aria";
}

async function loadWeatherData() {

    try {

        const response = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=45.4642&longitude=9.1900&current=temperature_2m,wind_speed_10m,wind_direction_10m"
        );

        const data = await response.json();

        document.getElementById("temp").textContent =
            Math.round(data.current.temperature_2m) + "°C";

        document.getElementById("wind").textContent =
            Math.round(data.current.wind_speed_10m) +
            " km/h " +
            windDirection(data.current.wind_direction_10m);

    } catch (error) {

        console.error(error);
    }
}

async function loadAirQuality() {

    try {

        const response = await fetch(
            "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=45.4642&longitude=9.1900&current=european_aqi"
        );

        const data = await response.json();

        document.getElementById("air").textContent =
            airQualityDisplay(
                data.current.european_aqi
            );

    } catch (error) {

        console.error(error);
    }
}

function updateClock() {

    const now = new Date();

    document.getElementById("date").textContent =
        now.toLocaleDateString("it-IT");

    document.getElementById("time").textContent =
        now.toLocaleTimeString("it-IT", {
            hour: "2-digit",
            minute: "2-digit"
        });
}

async function initialize() {

    await Promise.all([
        loadWeatherData(),
        loadAirQuality()
    ]);

    updateClock();

    setInterval(updateClock, 1000);

    setInterval(loadWeatherData, 1800000);

    setInterval(loadAirQuality, 1800000);
}

initialize();

</script>

</body>
</html>
