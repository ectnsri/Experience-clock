<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
}

body {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding-right: 10px;

    color: white;

    font-family:
        "Avenir Next",
        "Avenir",
        "Segoe UI",
        Arial,
        sans-serif;
}

.info {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    text-align: right;
}
</style>
</head>
<body>

<div id="info" class="info">
    Loading...
</div>

<script>

const FALLBACK_CITY = "Milano";
const FALLBACK_LAT = 45.4642;
const FALLBACK_LON = 9.1900;

function weatherIcon(code) {
    if (code === 0) return "☀️";
    if (code <= 3) return "⛅";
    if (code < 70) return "🌧️";
    if (code < 90) return "❄️";
    return "⛈️";
}

function updateDisplay(city, weather) {

    const now = new Date();

    const date = now.toLocaleDateString("it-IT");

    const time = now.toLocaleTimeString("it-IT", {
        hour: "2-digit",
        minute: "2-digit"
    });

    document.getElementById("info").innerHTML =
        `${city} | ${date} | ${time} | ${weather}`;
}

async function loadWeather(lat, lon, city) {

    try {

        const response = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=weather_code`
        );

        const data = await response.json();

        const weather = weatherIcon(data.current.weather_code);

        updateDisplay(city, weather);

        setInterval(() => {
            updateDisplay(city, weather);
        }, 1000);

    } catch {

        updateDisplay(city, "");

        setInterval(() => {
            updateDisplay(city, "");
        }, 1000);
    }
}

function loadMilan() {
    loadWeather(
        FALLBACK_LAT,
        FALLBACK_LON,
        FALLBACK_CITY
    );
}

if (navigator.geolocation) {

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            try {

                const response = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`
                );

                const data = await response.json();

                const city =
                    data.address.city ||
                    data.address.town ||
                    data.address.village ||
                    FALLBACK_CITY;

                loadWeather(lat, lon, city);

            } catch {

                loadWeather(lat, lon, FALLBACK_CITY);
            }
        },

        function() {

            // User denied location
            loadMilan();
        }
    );

} else {

    loadMilan();
}

</script>

</body>
</html>
