<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
}

body {
    color: white;
    font-family:
        "Avenir Next",
        "Avenir",
        "Segoe UI",
        Arial,
        sans-serif;
}

.container {
    width: 300px;
    height: 50px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-end;

    box-sizing: border-box;

    text-align: right;
    white-space: nowrap;
}

.topline {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.1;
    margin-bottom: 2px;
}

.time {
    font-size: 16px;
    font-weight: 600;
    line-height: 1;
}
</style>

</head>
<body>

<div class="container">
    <div id="topline" class="topline">
        🌤️ Milano 16/10/2026
    </div>
    <div id="time" class="time">
        14:15
    </div>
</div>

<script>

function weatherIcon(code) {
    if (code === 0) return "☀️";
    if (code <= 3) return "🌤️";
    if (code <= 48) return "☁️";
    if (code <= 67) return "🌦️";
    if (code <= 77) return "❄️";
    if (code <= 82) return "🌧️";
    return "⛈️";
}

let weather = "🌤️";

async function loadMilanWeather() {

    try {

        const response = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=45.4642&longitude=9.1900&current=weather_code"
        );

        const data = await response.json();

        weather = weatherIcon(data.current.weather_code);

    } catch (error) {

        weather = "🌤️";
    }
}

function updateDisplay() {

    const now = new Date();

    const date = now.toLocaleDateString("it-IT");

    const time = now.toLocaleTimeString("it-IT", {
        hour: "2-digit",
        minute: "2-digit"
    });

    document.getElementById("topline").textContent =
        `${weather} Milano ${date}`;

    document.getElementById("time").textContent =
        time;
}

async function initialize() {

    await loadMilanWeather();

    updateDisplay();

    setInterval(updateDisplay, 1000);

    setInterval(loadMilanWeather, 1800000);
}

initialize();

</script>

</body>
</html>
